name: AWS OIDC Pipeline - Destroy

on:
  workflow_dispatch:

env:
  TF_VERSION: "1.16.0"
  TF_WORKING_DIR: terraform-aws

permissions:
  id-token: write
  contents: read

concurrency:
  # Shared with aws.yaml's group so destroy can never run alongside plan/apply against
  # the same state (the S3 backend has no DynamoDB lock table configured).
  group: terraform-aws-state
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: ./.github/actions/terraform-aws
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::611182197776:role/githubaction-role
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve
