name: AWS OIDC Pipeline - Destroy

on:
  workflow_dispatch:
    inputs:
      account:
        description: AWS account to destroy
        type: choice
        required: true
        default: "611182197776"
        options:
          - "611182197776"
          - "256156540897"

env:
  TF_VERSION: "1.16.0"
  TF_WORKING_DIR: terraform-aws

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-aws-state-${{ inputs.account }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform setup
        uses: ./.github/actions/terraform-aws
        with:
          aws-region: eu-west-3
          role-to-assume: arn:aws:iam::${{ inputs.account }}:role/githubaction-role
          terraform-version: ${{ env.TF_VERSION }}
          working-directory: ${{ env.TF_WORKING_DIR }}
          backend-config: accounts/${{ inputs.account }}.backend.hcl

      - name: Terraform destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -var-file=accounts/${{ inputs.account }}.tfvars -auto-approve
