name: Terraform setup
description: Checkout, configure AWS OIDC credentials, install Terraform, and run terraform init

inputs:
  aws-region:
    required: true
  role-to-assume:
    required: true
  terraform-version:
    required: true
  working-directory:
    required: true
  backend-config:
    required: true
    description: Path (relative to working-directory) to the account's *.backend.hcl file

runs:
  using: composite
  steps:
    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -backend-config=${{ inputs.backend-config }} -reconfigure
